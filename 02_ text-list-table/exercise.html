<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        table {
            border-collapse: collapse;
        }
        th,
        td {
            border: 1px solid #94a3b8;
            padding: 6px 16px;
            text-align: center;
        }
    </style>
</head>
<body>
<table>
    <!-- 1행 -->
    <tr>
        <td>1</td>
        <td>2</td>
        <td>3</td>
        <td>4</td>
    </tr>
    <!-- 2행 -->
    <tr>
        <td>5</td>
        <td colspan="2">colspan-*2*</td>
<!--        <td>7</td>-->
        <td>8</td>
    </tr>
    <!-- 3행   -->
    <tr>
        <td>9</td>
        <td rowspan="2">rowspan-*2*</td>
        <td>11</td>
        <td>12</td>
    </tr>
    <!-- 4행 -->
    <tr>
        <td>13</td>
<!--        <td>14</td>-->
        <td>15</td>
        <td>16</td>
    </tr>
</table>
</body>
</html>
